name: Native compatibility and source distributions

on:
  workflow_dispatch:
  push:
    paths: &native-paths
      - 'MACS3/**'
      - 'test/**'
      - 'scripts/*native*'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/native-compatibility.yml'
  pull_request:
    paths: *native-paths

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, arch: x64, python: '3.12', numpy: 'numpy==1.26.4', cython: 'Cython==3.0.12'}
          - {os: ubuntu-24.04, arch: x64, python: '3.12', numpy: 'numpy==2.0.2', cython: 'Cython>=3.0'}
          - {os: ubuntu-24.04, arch: x64, python: '3.13', numpy: 'numpy==2.1.3', cython: 'Cython>=3.0'}
          - {os: ubuntu-24.04, arch: x64, python: '3.14', numpy: 'numpy==2.3.5', cython: 'Cython>=3.0'}
          - {os: ubuntu-24.04, arch: x64, python: '3.14', numpy: 'numpy>=2', cython: 'Cython>=3.0'}
          - {os: macos-15-intel, arch: x64, python: '3.12', numpy: 'numpy==1.26.4', cython: 'Cython==3.0.12'}
          - {os: macos-15, arch: arm64, python: '3.13', numpy: 'numpy==2.1.3', cython: 'Cython>=3.0'}
          - {os: macos-15, arch: arm64, python: '3.14', numpy: 'numpy>=2', cython: 'Cython>=3.0'}
          - {os: ubuntu-24.04-arm, arch: arm64, python: '3.14', numpy: 'numpy>=2', cython: 'Cython>=3.0'}
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMPY_SPEC: ${{ matrix.numpy }}
      CYTHON_SPEC: ${{ matrix.cython }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Resolve runtime and build versions together
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import os, pathlib, tomllib
          dependencies = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          dependencies += ['build>=1.6.1', 'pytest', 'setuptools>=80', os.environ['NUMPY_SPEC'], os.environ['CYTHON_SPEC']]
          pathlib.Path(os.environ['RUNNER_TEMP'], 'native-requirements.txt').write_text('\n'.join(dependencies))
          PY
          python -m pip install -r "$RUNNER_TEMP/native-requirements.txt"
          python - <<'PY'
          import os, pathlib, platform, sys, numpy, Cython, setuptools
          print(platform.platform(), platform.machine(), sys.version)
          assert platform.machine().lower() in ({'arm64', 'aarch64'} if os.environ['EXPECTED_ARCH'] == 'arm64' else {'x86_64', 'amd64'})
          pins = f'numpy=={numpy.__version__}\nCython=={Cython.__version__}\nsetuptools=={setuptools.__version__}\n'
          path = pathlib.Path(os.environ['RUNNER_TEMP'], 'native-constraints.txt')
          path.write_text(pins)
          print(pins)
          PY
          python -m pip freeze
      - name: Test in-place compiled extensions
        run: |
          python setup.py build_ext --inplace
          python scripts/run_native_regressions.py --run-slow
      - name: Build sdist and isolated wheel from sdist
        run: |
          python -m build --sdist --dependency-constraints-txt "$RUNNER_TEMP/native-constraints.txt" --outdir "$RUNNER_TEMP/native-dist"
          python scripts/check_native_distribution.py "$RUNNER_TEMP"/native-dist/*.tar.gz
          python - <<'PY'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive, = (root / 'native-dist').glob('*.tar.gz')
          with tarfile.open(archive) as bundle:
              bundle.extractall(root / 'native-sdist', filter='data')
          PY
          python -m build --wheel --dependency-constraints-txt "$RUNNER_TEMP/native-constraints.txt" --outdir "$RUNNER_TEMP/native-dist" "$RUNNER_TEMP"/native-sdist/*/
          python scripts/check_native_distribution.py "$RUNNER_TEMP"/native-dist/*.whl
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/native-dist/*.whl
      - uses: actions/checkout@v6
        with:
          path: clean-source
          submodules: true
      - name: Test installed wheel from a clean source checkout
        working-directory: clean-source
        run: python scripts/run_native_regressions.py --installed --run-slow
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-${{ matrix.os }}-py${{ matrix.python }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/native-dist/*
